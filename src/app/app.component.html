<ion-app>
  <ion-split-pane contentId="main-content" *ngIf="auth.isAuthenticated; else publicPages">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Tellevo</ion-list-header>
          <ion-note>Movilidad compartida</ion-note>

          <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
            <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-item (click)="compartirApp()">
          <ion-icon slot="start" ios="share-social" md="share-social" ></ion-icon>
          <ion-label>Compartir la app</ion-label>
        </ion-item>

        <ion-item (click)="abrirMapa()">
          <ion-icon slot="start" ios="map" md="map"></ion-icon>
          <ion-label>Mapa</ion-label>
        </ion-item>

        <ion-item (click)="cerrarSesion()">
          <ion-icon slot="start" ios="exit" md="exit"></ion-icon>
          <ion-label>Cerrar Sesión</ion-label>
        </ion-item>


      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
  <ng-template #publicPages>
    <ion-router-outlet></ion-router-outlet>
  </ng-template>
</ion-app>
